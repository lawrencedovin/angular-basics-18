<form class="donut-form" #form="ngForm" *ngIf="donut; else loading">
  <label>
    <span>Name</span>
    <input
      type="text"
      name="name"
      class="input"
      minlength="5"
      required
      [ngModel]="donut.name"
      [ngModelOptions]="{ updateOn: 'blur' }"
      #name="ngModel"
    />
    <ng-container *ngIf="name.touched && name.invalid">
      <div class="donut-form-error" *ngIf="name.errors?.minlength">
        Minimum length is 5.
      </div>
      <div class="donut-form-error" *ngIf="name.errors?.required">
        Name is required.
      </div>
    </ng-container>
  </label>
  <label>
    <span>Icon</span>
    <select
      name="icon"
      class="input input--select"
      required
      [ngModel]="donut.icon"
      #icon="ngModel"
    >
      <option *ngFor="let icon of icons" [ngValue]="icon">
        {{ icon }}
      </option>
    </select>
    <ng-container *ngIf="icon.touched && icon.invalid">
      <div class="donut-form-error" *ngIf="icon.errors?.required">
        Icon is required.
      </div>
    </ng-container>
  </label>
  <label>
    <span>Price</span>
    <input
      type="number"
      name="price"
      class="input"
      required
      [ngModel]="donut.price"
      #price="ngModel"
    />
    <ng-container *ngIf="price.touched && price.invalid">
      <div class="donut-form-error" *ngIf="price.errors?.required">
        Price is required.
      </div>
    </ng-container>
  </label>
  <div class="donut-form-radios">
    <p class="donut-form-radios-label">Promo:</p>
    <label>
      <input
        type="radio"
        name="promo"
        [value]="undefined"
        [ngModel]="donut.promo"
      />
      <span>None</span>
    </label>
    <label>
      <input type="radio" name="promo" value="new" [ngModel]="donut.promo" />
      <span>New</span>
    </label>
    <label>
      <input
        type="radio"
        name="promo"
        value="limited"
        [ngModel]="donut.promo"
      />
      <span>Limited</span>
    </label>
  </div>
  <label>
    <span>Description</span>
    <textarea
      name="description"
      class="input input--textarea"
      required
      [ngModel]="donut.description"
      #description="ngModel"
    >
    </textarea>
    <ng-container *ngIf="description.touched && description.invalid">
      <div class="donut-form-error" *ngIf="description.errors?.required">
        Description is required.
      </div>
    </ng-container>
  </label>
  <button
    *ngIf="!isEdit"
    type="button"
    class="btn btn--green-light"
    (click)="handleCreate(form)"
    [disabled]="form.invalid"
  >
    Create
  </button>
  <button
    *ngIf="isEdit"
    type="button"
    class="btn btn--green"
    (click)="handleUpdate(form)"
    [disabled]="form.untouched || form.invalid"
  >
    Update
  </button>
  <button
    *ngIf="isEdit"
    type="button"
    class="btn btn--red"
    (click)="handleDelete()"
    [disabled]="form.invalid"
  >
    Delete
  </button>
  <button
    *ngIf="form.touched || isEdit"
    type="button"
    class="btn btn--grey"
    (click)="form.resetForm()"
  >
    Reset Form
  </button>
  <div class="donut-form-working" *ngIf="form.valid && form.submitted">
    Working...
  </div>
</form>
<ng-template #loading>Loading...</ng-template>
