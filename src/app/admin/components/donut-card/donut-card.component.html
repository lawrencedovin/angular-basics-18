<a 
    class="donut-card"
    [routerLink]="donut.id"
    [ngClass]="{
        'donut-card-promo': donut.promo
    }"
>
    <img 
        src="/assets/img/{{donut.icon}}.svg"
        [alt]="donut.name"
        class="donut-card-icon"
    />
    <div>
        <p class="donut-card-name">
            {{ donut.name }}
            <ng-container [ngSwitch]="donut.promo">
                <span *ngSwitchCase="'new'" class="donut-card-label donut-card-label-new">
                    NEW
                </span>
                <span *ngSwitchCase="'limited'" class="donut-card-label donut-card-label-limited">
                    LIMITED
                </span>
            </ng-container>
        </p>
        <p class="donut-card-price">
            {{ donut.price / 100 | currency: 'USD' }}
        </p>
    </div>
</a>
